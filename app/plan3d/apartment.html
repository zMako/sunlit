<style>

<script type="module">

  activeRoom = id; const f = furn[id]; if (!f) { furnEl.style.display = 'none'; return; }
  f.panelEl = furnEl; f.setActive(true); f._panel(); furnEl.style.display = 'block';
}
function setFurnClip(planes) { for (const f of Object.values(furn)) f.setClipping(planes); }
document.getElementById('bClearSel').onclick = () => { if (activeRoom && furn[activeRoom]) { furn[activeRoom].setActive(false); furn[activeRoom].panelEl = null; } activeRoom = null; furnEl.style.display = 'none'; };
document.getElementById('bAutoAll').onclick = async () => { const b = document.getElementById('bAutoAll'); b.disabled = true; for (const r of layout.rooms) { if (!furn[r.id] || ['hallway', 'closet', 'bathroom'].includes(r.type)) continue; b.textContent = `arranging ${r.name}…`; await furn[r.id].auto(); } b.textContent = 'Auto-furnish all rooms'; b.disabled = false; unitTotal(); };

renderer.domElement.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });

  camera.fov = 45; camera.position.set(center.x + ext * 0.75, ext * 0.95 + 2, center.z + ext * 0.9); orbit.target.set(center.x, 0.6, center.z); camera.updateProjectionMatrix(); orbit.update();

const matIds = new Set(); apt.group.traverse(o => { if (o.isMesh && o.material?.userData?.materialId) matIds.add(o.material.userData.materialId); });

const v0 = Q.get('view'); if (v0 === 'walk') setWalk(Q.get('room'), Q.has('yaw') ? +Q.get('yaw') : undefined); else setDoll();
setTimeout(() => { if (mode === 'doll') setFurnClip([clipPlane]); labelOcclusion(mode === 'walk'); }, 1500);
if (Q.has('clip')) { clipPlane.constant = +Q.get('clip'); document.getElementById('clip').value = Q.get('clip'); document.getElementById('clipv').textContent = (+Q.get('clip')).toFixed(2) + ' m'; if (mode === 'doll') apt.section(clipPlane.constant); }
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); if (gtao) gtao.setSize(innerWidth, innerHeight); });
// furniture labels (sprites with depthTest off) show through walls in walk view: occlude them there, float them in the dollhouse
function labelOcclusion(walkMode) { for (const f of Object.values(furn)) f.group?.traverse(o => { if (o.isSprite) { o.material.depthTest = walkMode; o.material.depthWrite = false; o.material.needsUpdate = true; } }); }
let roomTick = 0;
(function loop() { requestAnimationFrame(loop); const dt = Math.min(clock.getDelta(), 0.05); if (mode !== 'walk' && apt && apt.ceilingMeshes) for (const m of apt.ceilingMeshes) m.visible = false; /* guard: nothing may re-show ceilings in dollhouse (they render as black slabs from above) */ if (mode === 'walk') { stepWalk(dt); if ((roomTick += dt) > 0.5) { roomTick = 0; const r = currentRoom(); if (r && r !== activeRoom && furn[r]) activateRoom(r); } } else orbit.update(); if (contextLost) return; if (LOW || postFailed) renderer.render(scene, camera); else { try { composer.render(); } catch (e) { postFailed = true; console.warn('post-processing disabled', e); } } })();
if (Q.has('furn')) activateRoom(Q.get('furn'));
window.setWalk = setWalk; window.setDoll = setDoll; window.__cam = { camera, orbit, scene, sun, hemi, renderer, layout: () => layout };   // headless screenshots position the camera through this

// ---------- plan window: the source floor plan, with the rebuilt layout drawn over it in plan pixels (debug: does the 3D match?) ----------
(function planWindow() {
  const box = document.getElementById('plan'), img = document.getElementById('pImg'), svg = document.getElementById('pSvg'), sc = layout.scale || {};
  const p = layout.plan_image || '', i = p.indexOf('/listings/');
  if (i < 0 || !sc.m_per_px || !sc.origin_px) { box.style.display = 'none'; return; }
  document.body.classList.add('hasplan');
  const s = sc.image_scale || 1, [ox, oy] = sc.origin_px, mpp = sc.m_per_px;
  const P = (x, z) => [((x / mpp + ox) / s).toFixed(1), ((z / mpp + oy) / s).toFixed(1)];   // metres -> original image pixels (inverse of plan_engine's M)
  const px = m => m / mpp / s;
  const OFF = el => { const lv = (layout.levels || []).find(v => v.id === ((el && el.level) || 0)); return lv && lv.plan_offset_m ? lv.plan_offset_m : [0, 0]; };   // stacked levels were shifted onto level 0: undo for the drawing
  const PL = (el, x, z) => { const o = OFF(el); return P(x + o[0], z + o[1]); };
  let cam = null;
  img.onload = () => {
    svg.setAttribute('viewBox', `0 0 ${img.naturalWidth} ${img.naturalHeight}`);
    const lw = Math.max(img.naturalWidth, img.naturalHeight) / 400;   // stroke width that reads at window size
    let out = '<g id="pOv">';
    for (const r of layout.rooms) out += `<polygon points="${r.polygon.map(q => PL(r, q[0], q[1]).join(',')).join(' ')}" fill="rgba(37,99,235,.13)" stroke="rgba(37,99,235,.55)" stroke-width="${lw * 0.6}"><title>${r.name} · ${(r.area_m2 || 0).toFixed(1)} m²</title></polygon>`;
    const W = {}; for (const w of layout.walls) { W[w.id] = w; const [x1, y1] = PL(w, ...w.a), [x2, y2] = PL(w, ...w.b);
      out += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${w.exterior ? 'rgba(220,38,38,.75)' : 'rgba(234,88,12,.7)'}" stroke-width="${Math.max(px(w.thickness_m || 0.1), lw)}" stroke-linecap="butt"/>`; }
    for (const o of layout.openings) { const w = W[o.wall]; if (!w) continue; const L = Math.hypot(w.b[0] - w.a[0], w.b[1] - w.a[1]) || 1, ux = (w.b[0] - w.a[0]) / L, uz = (w.b[1] - w.a[1]) / L;
      const [x1, y1] = PL(w, w.a[0] + ux * o.s0, w.a[1] + uz * o.s0), [x2, y2] = PL(w, w.a[0] + ux * o.s1, w.a[1] + uz * o.s1);
      out += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${o.type === 'window' ? '#06b6d4' : '#16a34a'}" stroke-width="${Math.max(px(w.thickness_m || 0.1), lw) * 1.3}"><title>${o.type} ${(o.width_m || o.s1 - o.s0).toFixed(2)} m</title></line>`; }
    out += '</g>';
    out += `<g id="pCam" style="display:none"><path d="M0,0 L22,-10 L22,10 Z" fill="rgba(220,38,38,.4)"/><circle r="5" fill="#dc2626" stroke="#fff" stroke-width="1.5"/></g>`;
    svg.innerHTML = out; cam = svg.querySelector('#pCam');
  };
  img.src = p.slice(i);
  const btn = id => document.getElementById(id);
  btn('pOver').onclick = e => { const g = svg.querySelector('#pOv'); const on = e.target.classList.toggle('on'); if (g) g.style.display = on ? '' : 'none'; };
  btn('pBig').onclick = () => { box.classList.toggle('big'); box.classList.remove('off'); };
  btn('pHide').onclick = () => { const off = box.classList.toggle('off'); btn('pHide').textContent = off ? '+' : '–'; document.body.classList.toggle('hasplan', !off); };
  // where you stand: camera position and heading on the plan (walk view)
  const dir = new THREE.Vector3();
  (function tick() { requestAnimationFrame(tick); if (!cam) return; if (mode !== 'walk') { cam.style.display = 'none'; return; }
    camera.getWorldDirection(dir); const [x, y] = PL({ level: levelAtY(camera.position.y) }, camera.position.x, camera.position.z);
    cam.style.display = ''; cam.setAttribute('transform', `translate(${x},${y}) rotate(${(Math.atan2(dir.z, dir.x) * 180 / Math.PI).toFixed(1)}) scale(${(img.naturalWidth / (img.clientWidth || 1)).toFixed(3)})`); })();   // marker drawn in screen pixels at any window size
})();
</script>
