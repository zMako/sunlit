<!doctype html><html><head><meta charset="utf-8"><title>Sunlit · apartments from floor plans</title>
<style>:root{--bg:#0f1319;--card:#171d26;--ink:#e8edf3;--ink2:#9aa6b5;--acc:#6ea8fe}body{margin:0;font:14px/1.45 -apple-system,Inter,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:18px 24px;border-bottom:1px solid #243040}h1{margin:0;font-size:18px}h2{font-size:15px;margin:22px 0 10px;color:var(--ink2);font-weight:600}
main{padding:10px 24px 40px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--card);border:1px solid #243040;border-radius:12px;overflow:hidden;display:flex;flex-direction:column}.card img{width:100%;height:190px;object-fit:contain;background:#fff}
.body{padding:10px 12px;display:flex;flex-direction:column;gap:6px}.title{font-weight:600}.meta{color:var(--ink2);font-size:12px}.rooms{font-size:12px;color:var(--ink2)}
.row{display:flex;gap:8px;align-items:center;margin-top:4px}.btn{background:var(--acc);color:#07111f;border:none;border-radius:8px;padding:6px 10px;font-weight:600;text-decoration:none;font-size:13px}
.issues{font-size:11px;color:#c9a36a;max-height:48px;overflow:hidden}</style></head><body>
<header><h1>Sunlit · apartments rebuilt from their floor plans</h1><div class="meta">Each card is one unit type of a building. Open it as a dollhouse, walk through it, furnish it.</div></header>
<main id="root">loading…</main>
<script>
fetch('layouts/index.json').then(r=>r.json()).then(units=>{
  const by={}; for(const u of units){ (by[u.building||u.listing] ||= []).push(u); }
  let html='';
  for(const [b,us] of Object.entries(by)){
    html+=`<h2>${b} <span class="meta">${us[0].listing} · ${us.length} unit type${us.length>1?'s':''}</span></h2><div class="grid">`;
    for(const u of us){ const rooms=u.rooms.filter(r=>r.area_m2>2).map(r=>`${r.name} ${r.area_m2} m²`).join(' · ');
      html+=`<div class="card"><img src="${u.plan_image}" loading="lazy"><div class="body"><div class="title">${u.plan_name||u.unit}</div>
        <div class="meta">${u.rooms.length} rooms · ${u.area_m2} m² · ${u.n_fixtures} fixtures · scale: ${u.scale_from[0].replace(/_/g,' ')}</div>
        <div class="rooms">${rooms}</div>${u.issues&&u.issues.length?`<div class="issues" title="${u.issues.join('\n').replace(/"/g,'&quot;')}">review: ${u.issues.length} note${u.issues.length>1?'s':''}</div>`:''}
        <div class="row"><a class="btn" href="apartment.html?unit=${u.unit}" target="_blank">open 3D</a><a class="btn" style="background:#2a3444;color:#dfe7f1" href="apartment.html?unit=${u.unit}&view=walk" target="_blank">walk</a></div></div></div>`; }
    html+='</div>'; }
  document.getElementById('root').innerHTML=html||'no units yet';
}).catch(e=>{document.getElementById('root').textContent='no index yet: '+e;});
</script></body></html>
