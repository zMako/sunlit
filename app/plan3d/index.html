<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Every apartment · Move-in</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- The library: every unit type rebuilt from its floor plan, grouped by building, best-prepared first. Customer view by default;
     ?dev=1 adds unit ids, scale sources, review notes, plan metrics and links to the engineering viewer (apartment.html). -->
<link rel="stylesheet" href="/ui/movein.css">
<style>
:root{--wrap:min(1240px,100vw - 80px)}
.wrap{width:var(--wrap);margin:0 auto}
nav.glass{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:6px;padding:6px 6px 6px 22px;border-radius:999px;white-space:nowrap}
nav .mark{font-family:var(--serif);font-size:22px;text-decoration:none;margin-right:18px}
nav .links a{font-size:14px;text-decoration:none;padding:8px 12px;border-radius:999px;opacity:.78}
nav .links a:hover,nav .links a[aria-current]{opacity:1}
header.top{padding:140px 0 36px}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(48px,6vw,84px);line-height:1;letter-spacing:-.02em;margin:0 0 14px}
.lede{color:var(--graphite);font-size:19px;margin:0;max-width:48ch}
.bar{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--hair)}
.bar .wrap{display:flex;gap:10px;align-items:center;padding:14px 0;flex-wrap:wrap}
.bar .input{width:280px}
.bar .select{width:auto;border-radius:999px;padding-top:10px;padding-bottom:10px}
.bar .count{margin-left:auto;color:var(--graphite);font-size:14px}
label.ck{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--graphite);cursor:pointer}
label.ck input{accent-color:var(--ink);width:15px;height:15px}
main{padding:10px 0 120px}
.building{margin-top:64px}
.building h2{font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.1;letter-spacing:-.01em;margin:0 0 4px}
.building .sub{color:var(--graphite);font-size:14px;margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:40px 24px}
.unit .img{display:block;aspect-ratio:4/3;border-radius:18px;overflow:hidden;background:#fff;box-shadow:inset 0 0 0 1px var(--hair)}
.unit .img img{width:100%;height:100%;object-fit:contain;padding:14px;display:block}
.unit h3{font-family:var(--serif);font-weight:400;font-size:24px;line-height:1.15;margin:16px 0 2px}
.unit .meta{color:var(--graphite);font-size:14px}
.unit .acts{display:flex;gap:18px;margin-top:10px;font-size:14px;align-items:center;flex-wrap:wrap}
.unit .acts a{text-decoration:none;border-bottom:1px solid var(--hair);padding-bottom:2px}
.unit .acts a:first-child{border-color:currentColor}
.unit .acts a:hover{border-color:currentColor}
.prep{background:none;border:0;padding:0;font:inherit;color:var(--graphite);cursor:pointer;border-bottom:1px dashed var(--hair)}
.prep:hover{color:var(--ink)}
.prep:disabled{cursor:wait}
.prep.err{color:var(--bad);border-color:transparent;cursor:default}
.spin{display:inline-block;width:10px;height:10px;border:2px solid var(--graphite);border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;margin-right:6px;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}
.dev{font-size:12px;color:var(--graphite);margin-top:6px;line-height:1.5}
.dev .b{display:inline-block;border-radius:999px;padding:0 7px;margin:2px 3px 0 0;background:var(--mist)}
.dev .warn{color:var(--warn)}
.more{display:flex;justify-content:center;margin-top:64px}
.empty{color:var(--graphite);padding:60px 0;text-align:center}
.metrics{display:flex;gap:28px;flex-wrap:wrap;margin-top:28px}
.metrics div{font-size:13px;color:var(--graphite);max-width:22ch}
.metrics b{display:block;font-family:var(--serif);font-weight:400;font-size:30px;color:var(--ink);line-height:1.1}
footer{border-top:1px solid var(--hair);padding:28px 0 40px;color:var(--graphite);font-size:13px}
footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
footer a{text-decoration:none}footer a:hover{text-decoration:underline}
@media (max-width:860px){nav .links{display:none}.bar .input{width:100%}.bar .count{margin-left:0}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style></head>
<body class="mi">
<nav class="glass" aria-label="Main">
  <a class="mark" href="landing.html">Move-in</a>
  <span class="links"><a href="index.html" aria-current="page">Homes</a><a href="landing.html#how">How it works</a><a href="../map/find.html">Map</a></span>
  <a class="pill" href="../map/find.html">Find a home</a>
</nav>
<header class="top wrap">
  <h1>Every apartment.</h1>
  <p class="lede" id="lede">Each one rebuilt in 3D from the floor plan its landlord published.</p>
  <div class="metrics" id="metrics" hidden></div>
</header>
<div class="bar"><div class="wrap">
  <input class="input" id="q" placeholder="Building, plan or room" aria-label="Search">
  <select class="select" id="fb" aria-label="Building"><option value="">All buildings</option></select>
  <select class="select" id="fr" aria-label="Size"><option value="">Any size</option><option value="0">Studio</option><option value="1">1 bedroom</option><option value="2">2 bedrooms</option><option value="3">3+ bedrooms</option></select>
  <label class="ck"><input type="checkbox" id="fa"> Ready to furnish</label>
  <span class="count" id="count"></span>
</div></div>
<main class="wrap" id="root"><div class="empty">Loading every apartment…</div></main>
<footer><div class="wrap"><span>Move-in, built at Cal Hacks 13.0 from public listings.</span><span><a href="polish/polish.html">Photo next to render</a> &nbsp; <a href="metrics/METRICS.md">How we measured</a></span></div></footer>
<script type="module">
import { enhanceAll } from '/ui/glass.js'; enhanceAll();
const $ = id => document.getElementById(id), Q = new URLSearchParams(location.search), DEV = Q.get('dev') === '1';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const annotated = u => u.annotated != null ? !!u.annotated : !!(u.materials || (u.issues && u.issues.length) || u.rooms.some(r => r.type && r.type !== 'other'));
function bedrooms(u) { const n = u.rooms.filter(r => r.type === 'bedroom').length; if (annotated(u) && u.rooms.some(r => r.type !== 'other')) return n;
  const m = /prior (\d+) bedroom/.exec((u.scale_from || []).join(' ')); return m ? +m[1] : null; }
const sizeText = u => { const b = bedrooms(u), s = b == null ? '' : b === 0 ? 'Studio' : `${b} bedroom${b > 1 ? 's' : ''}`; return [s, u.area_m2 ? `${Math.round(u.area_m2)} m²` : ''].filter(Boolean).join(', '); };
const score = u => (annotated(u) ? 1000 : 0) + (u.materials ? 300 : 0) + ((u.scale_from || [])[0]?.startsWith('reader_dims+printed') ? 200 : 0) + Math.min(u.n_fixtures || 0, 30) * 3 + Math.min(u.rooms.filter(r => r.area_m2 > 2).length, 12) * 10;
const short = b => String(b || '').replace(/ Apartments.*$/, '');
let UNITS = [], CAP = 48; const ANN = {};

function devInfo(u) {
  if (!DEV) return ''; const s0 = (u.scale_from || [])[0] || '';
  const tags = [s0.startsWith('reader_dims+printed') ? 'printed dimensions' : s0.includes('sqft') ? 'listed sqft' : s0.startsWith('annotation_dims') ? 'Claude size estimate' : 'prior size', annotated(u) ? 'annotated' : null, u.materials ? 'materials from photos' : null, u.n_fixtures ? `${u.n_fixtures} fixtures` : null].filter(Boolean);
  return `<div class="dev">${esc(u.unit)} · <a href="apartment.html?unit=${encodeURIComponent(u.unit)}">engineering viewer</a><br>${tags.map(t => `<span class="b">${esc(t)}</span>`).join('')}${u.issues && u.issues.length ? `<br><span class="warn" title="${esc(u.issues.join('\n'))}">${u.issues.length} review note${u.issues.length > 1 ? 's' : ''}</span>` : ''}</div>`;
}
function prepBtn(u) {   // unannotated plans: Claude names the rooms and places kitchen and bath fixtures (~5 cents, spend-capped)
  if (annotated(u)) return ''; const st = ANN[u.unit];
  if (st === 'running') return `<button class="prep" data-ann="${esc(u.unit)}" disabled><span class="spin"></span>Reading the plan…</button>`;
  if (st) return `<button class="prep err" data-ann="${esc(u.unit)}">${esc(st)}</button>`;
  return `<button class="prep" data-ann="${esc(u.unit)}" title="Claude names the rooms and places the kitchen and bath fixtures">Name the rooms</button>`;
}
function card(u) {
  const a = `home.html?unit=${encodeURIComponent(u.unit)}`;
  return `<article class="unit"><a class="img" href="${a}"><img src="${esc(u.plan_image)}" loading="lazy" alt="Floor plan of ${esc(u.plan_name || 'this apartment')}"></a>
    <h3>${esc(u.plan_name || 'Apartment')}</h3><div class="meta">${esc(sizeText(u))}</div>
    <div class="acts"><a href="${a}">View in 3D</a><a href="${a}&view=walk">Walk through</a>${prepBtn(u)}</div>${devInfo(u)}</article>`;
}
function render() {
  const q = $('q').value.trim().toLowerCase(), fb = $('fb').value, fr = $('fr').value, fa = $('fa').checked;
  const list = UNITS.filter(u => (!fb || u.building === fb) && (!fa || annotated(u)) && (fr === '' || (fr === '3' ? bedrooms(u) >= 3 : bedrooms(u) === +fr))
    && (!q || [u.building, u.plan_name, u.listing, DEV ? u.unit : '', ...u.rooms.map(r => r.name)].join(' ').toLowerCase().includes(q)));
  const by = new Map(); for (const u of list) { const b = u.building || u.listing; if (!by.has(b)) by.set(b, []); by.get(b).push(u); }
  for (const us of by.values()) us.sort((a, b) => score(b) - score(a) || String(a.plan_name).localeCompare(String(b.plan_name)));
  const groups = [...by.entries()].sort((a, b) => score(b[1][0]) - score(a[1][0]) || b[1].length - a[1].length);
  let html = '', shown = 0; const cap = q || fb ? Infinity : CAP;
  for (const [b, us] of groups) { if (shown >= cap) break;
    html += `<section class="building"><h2>${esc(short(b))}</h2><div class="sub">${us.length} plan${us.length > 1 ? 's' : ''}${DEV ? ` · ${esc(us[0].listing)}` : ''}</div><div class="grid">`;
    for (const u of us) { if (shown++ >= cap) break; html += card(u); } html += '</div></section>'; }
  if (list.length > shown) html += `<div class="more"><button class="pill ghost lg" id="more">Show more</button></div>`;
  $('count').textContent = `${list.length} of ${UNITS.length}`;
  $('root').innerHTML = html || '<div class="empty">No apartment matches. Clear a filter.</div>';
  const m = $('more'); if (m) m.onclick = () => { CAP += 48; render(); };
}
async function annotate(unit) {
  if (ANN[unit] === 'running') return; ANN[unit] = 'running'; render();
  let res; try { res = await (await fetch(`/api/annotate?unit=${encodeURIComponent(unit)}`, { method: 'POST' })).json(); } catch (e) { res = { error: 'unreachable' }; }
  if (res.ok) { delete ANN[unit];
    try { const fresh = await (await fetch('layouts/index.json', { cache: 'no-store' })).json(); const nu = fresh.find(x => x.unit === unit); const i = UNITS.findIndex(x => x.unit === unit); if (nu && i >= 0) UNITS[i] = nu; } catch (e) {}
    const u = UNITS.find(x => x.unit === unit); if (u) u.annotated = true; }
  else ANN[unit] = res.error === 'budget cap reached' ? 'Not available today' : res.error === 'busy' ? 'Busy, try again' : 'Could not read the plan';
  render();
}
document.addEventListener('click', e => { const b = e.target.closest('[data-ann]'); if (b && !b.disabled && !b.classList.contains('err')) annotate(b.dataset.ann); });

fetch('layouts/index.json').then(r => r.json()).then(units => {
  UNITS = units; const blds = [...new Set(units.map(u => u.building || u.listing))].sort();
  $('fb').innerHTML += blds.map(b => `<option value="${esc(b)}">${esc(short(b))}</option>`).join('');
  const nb = new Set(units.map(u => u.listing || u.building)).size;   // listings, as on the landing page (two listings share a building name)
  $('lede').textContent = `${units.length.toLocaleString('en-US')} apartments in ${nb} buildings, each rebuilt in 3D from the floor plan its landlord published.`;
  if (DEV) fetch('metrics/summary.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(s => {
    if (!Array.isArray(s)) return; $('metrics').hidden = false;
    $('metrics').innerHTML = s.slice(0, 6).map(m => `<div title="${esc(m.method)}"><b>${esc((Math.round(m.value * 10) / 10).toLocaleString('en-US'))}${m.unit === '%' ? '%' : ''}</b>${esc(m.label)}</div>`).join(''); }).catch(() => {});
  for (const id of ['q', 'fb', 'fr', 'fa']) $(id).addEventListener('input', () => { CAP = 48; render(); });
  render();
}).catch(e => { $('root').innerHTML = '<div class="empty">The apartment index is not available right now.</div>'; });
</script></body></html>
